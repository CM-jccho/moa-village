<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3566"/>
      <stop offset=".55" stop-color="#262a4d"/>
      <stop offset="1" stop-color="#1b1f3a"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f7ff"/>
      <stop offset="1" stop-color="#cfdcf5"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f08a74"/>
      <stop offset="1" stop-color="#c1503f"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <circle cx="358" cy="132" r="150" fill="url(#glow)"/>
  <circle cx="372" cy="120" r="46" fill="#fff3c4"/>
  <circle cx="352" cy="132" r="10" fill="#f0e2b4" opacity=".7"/>
  <circle cx="388" cy="146" r="8" fill="#f0e2b4" opacity=".6"/>

  <!-- stars -->
  <g fill="#fff6dc">
    <circle cx="112" cy="104" r="5"/>
    <circle cx="196" cy="66" r="4"/>
    <circle cx="150" cy="168" r="3.4"/>
    <circle cx="290" cy="86" r="3.4"/>
    <circle cx="430" cy="228" r="4"/>
  </g>

  <!-- ground -->
  <ellipse cx="256" cy="412" rx="196" ry="58" fill="url(#ground)"/>
  <ellipse cx="256" cy="404" rx="176" ry="46" fill="#ffffff" opacity=".55"/>

  <!-- house -->
  <rect x="196" y="272" width="120" height="104" rx="8" fill="#f6ead6"/>
  <path d="M176 276 L256 196 L336 276 Z" fill="url(#roof)"/>
  <path d="M176 276 L256 196 L336 276 Z" fill="none" stroke="#fff6ec" stroke-width="0" />
  <path d="M186 272 L256 204 L326 272 L316 280 L256 220 L196 280 Z" fill="#ffffff" opacity=".92"/>
  <rect x="244" y="318" width="30" height="58" rx="4" fill="#8b5a30"/>
  <circle cx="268" cy="348" r="3.4" fill="#ffd98a"/>
  <rect x="210" y="300" width="26" height="24" rx="4" fill="#ffd98a"/>
  <rect x="282" y="300" width="26" height="24" rx="4" fill="#ffd98a"/>
  <path d="M223 300v24M210 312h26M295 300v24M282 312h26" stroke="#b5865a" stroke-width="3" opacity=".7"/>

  <!-- tree -->
  <rect x="348" y="352" width="12" height="40" rx="6" fill="#7b5232"/>
  <path d="M354 226 L404 320 H304 Z" fill="#3f9c74"/>
  <path d="M354 268 L416 372 H292 Z" fill="#46a87c"/>
  <path d="M354 226 L374 268 H334 Z" fill="#6ecb9c" opacity=".75"/>
  <circle cx="330" cy="330" r="6" fill="#ffe08a"/>
  <circle cx="382" cy="352" r="6" fill="#ffa08a"/>

  <!-- snowman -->
  <ellipse cx="140" cy="392" rx="34" ry="24" fill="#ffffff"/>
  <circle cx="140" cy="340" r="26" fill="#ffffff"/>
  <circle cx="131" cy="334" r="3.4" fill="#2a2438"/>
  <circle cx="149" cy="334" r="3.4" fill="#2a2438"/>
  <path d="M140 342 l12 5 -12 4z" fill="#f08a3c"/>
  <path d="M120 306 h40 l-5 -18 h-30z" fill="#2f2a44"/>
  <rect x="114" y="304" width="52" height="8" rx="4" fill="#2f2a44"/>
  <path d="M118 362 q22 10 44 0" stroke="#e2614c" stroke-width="9" fill="none" stroke-linecap="round"/>

  <!-- falling snow -->
  <g fill="#ffffff" opacity=".9">
    <circle cx="120" cy="216" r="5"/>
    <circle cx="212" cy="132" r="4"/>
    <circle cx="330" cy="150" r="5"/>
    <circle cx="88" cy="300" r="3.4"/>
    <circle cx="430" cy="320" r="4"/>
    <circle cx="466" cy="168" r="3"/>
    <circle cx="60" cy="180" r="3"/>
