name: hourly-trends

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hourly-trends
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update trending items
        run: python scripts/update_trends.py

      - name: Commit if changed
        run: |
          git config user.name "moa-village-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/trending-items.json
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "chore(trends): hourly trending items $(date -u +%Y-%m-%dT%HZ)"
            git push
          fi
